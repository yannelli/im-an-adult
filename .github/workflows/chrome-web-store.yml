name: Chrome Web Store

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer release tag to publish (for example v0.1.1)
        required: true
        type: string

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the SemVer tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Not a SemVer release tag: $TAG"
              exit 1
            fi
            echo "Not a SemVer release tag ($TAG); skipping Chrome Web Store publish."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=im-an-adult-${TAG#v}.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: ${{ steps.tag.outputs.skip != '1' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.tag.outputs.skip != '1' }}
        with:
          bun-version-file: package.json
      - name: Download the GitHub Release zip
        if: ${{ steps.tag.outputs.skip != '1' }}
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.tag.outputs.zip }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern "$ZIP" --dir dist
          test -f "dist/$ZIP"
          echo "path=dist/$ZIP" >> "$GITHUB_OUTPUT"
      - name: Publish to the Chrome Web Store
        if: ${{ steps.tag.outputs.skip != '1' }}
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: ${{ vars.CHROME_PUBLISH_TARGET }}
          CHROME_ZIP_PATH: ${{ steps.zip.outputs.path }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: bun scripts/publish-chrome-web-store.mjs
