name: Chrome Web Store

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer release tag to publish (for example v0.1.1)
        required: true
        type: string

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Download the GitHub Release zip
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern "im-an-adult-*.zip" --dir dist
          ZIP=$(ls dist/im-an-adult-*.zip)
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish to the Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: ${{ vars.CHROME_PUBLISH_TARGET }}
          CHROME_ZIP_PATH: ${{ steps.zip.outputs.path }}
          RELEASE_TAG: ${{ steps.zip.outputs.tag }}
        run: bun scripts/publish-chrome-web-store.mjs
