<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I'm an Adult</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="masthead">
      <h1><img src="assets/logo.svg" alt="I’m an Adult." /></h1>
      <p class="tagline">Let me scroll<span class="dot">.</span></p>
    </header>

    <label class="site" id="site-panel" data-state="active" for="site-enabled">
      <span class="site-info">
        <span class="overline">This site</span>
        <span class="hostname" id="site-name">&hellip;</span>
        <span class="site-status" id="site-status"></span>
      </span>
      <input id="site-enabled" type="checkbox" role="switch" checked />
    </label>

    <main>
      <section class="group" aria-labelledby="scroll-heading">
        <h2 class="overline rule" id="scroll-heading">Scrolling</h2>
        <label class="row">
          <span>
            <strong>Block scroll hijacking</strong>
            <small>Pages can&rsquo;t cancel or capture wheel and touch input</small>
          </span>
          <input id="block-hijacking" type="checkbox" role="switch" checked />
        </label>
        <label class="row">
          <span>
            <strong>Disable scroll effects</strong>
            <small>No smooth scrolling, snap points, or scroll-driven animation</small>
          </span>
          <input id="disable-scroll-effects" type="checkbox" role="switch" checked />
        </label>
      </section>

      <section class="group group-secondary" aria-labelledby="media-heading">
        <h2 class="overline rule" id="media-heading">While we&rsquo;re at it</h2>
        <label class="row">
          <span>
            <strong>Block autoplay</strong>
            <small>Media waits until you press play</small>
          </span>
          <input id="block-autoplay" type="checkbox" role="switch" />
        </label>
      </section>
    </main>

    <footer>
      <p>Preferences apply on every site. The switch up top only speaks for this one.</p>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
